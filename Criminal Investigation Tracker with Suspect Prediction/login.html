<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Criminal Investigation System - Login</title>
    
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <!-- Custom CSS -->
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #0a0a0a;
            background-image: 
                linear-gradient(0deg, transparent 24%, rgba(255, 0, 0, .05) 25%, rgba(255, 0, 0, .05) 26%, transparent 27%, transparent 74%, rgba(255, 0, 0, .05) 75%, rgba(255, 0, 0, .05) 76%, transparent 77%, transparent),
                linear-gradient(90deg, transparent 24%, rgba(255, 0, 0, .05) 25%, rgba(255, 0, 0, .05) 26%, transparent 27%, transparent 74%, rgba(255, 0, 0, .05) 75%, rgba(255, 0, 0, .05) 76%, transparent 77%, transparent);
            background-size: 50px 50px;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            position: relative;
            overflow: hidden;
        }

        body::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: radial-gradient(circle at 50% 50%, rgba(255, 0, 0, 0.1) 0%, transparent 50%);
            pointer-events: none;
        }
        
        .login-container {
            max-width: 500px;
            width: 100%;
            z-index: 10;
        }
        
        .login-card {
            border-radius: 20px;
            box-shadow: 
                0 0 30px rgba(255, 0, 0, 0.3),
                0 0 60px rgba(0, 255, 0, 0.2),
                0 15px 40px rgba(0, 0, 0, 0.8);
            overflow: hidden;
            background: #1a1a1a;
            border: 1px solid #333;
            animation: cardGlow 3s ease-in-out infinite alternate;
        }

        @keyframes cardGlow {
            0% {
                box-shadow: 
                    0 0 30px rgba(255, 0, 0, 0.3),
                    0 0 60px rgba(0, 255, 0, 0.2),
                    0 15px 40px rgba(0, 0, 0, 0.8);
            }
            100% {
                box-shadow: 
                    0 0 40px rgba(255, 0, 0, 0.5),
                    0 0 80px rgba(0, 255, 0, 0.3),
                    0 15px 50px rgba(0, 0, 0, 0.9);
            }
        }
        
        .login-header {
            background: linear-gradient(135deg, #1a0000 0%, #330000 50%, #1a0000 100%);
            color: #00ff00;
            padding: 40px 30px;
            text-align: center;
            border-bottom: 2px solid #ff0000;
            position: relative;
        }

        .logo-container {
            margin-bottom: 20px;
        }

        .logo {
            width: 100px;
            height: 100px;
            margin: 0 auto;
            position: relative;
            animation: logoFloat 3s ease-in-out infinite;
        }

        @keyframes logoFloat {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-10px); }
        }

        .logo svg {
            width: 100%;
            height: 100%;
            filter: drop-shadow(0 0 10px #ff0000) drop-shadow(0 0 20px #00ff00);
        }
        
        .login-header h2 {
            margin: 0;
            font-weight: 700;
            font-size: 2rem;
            text-shadow: 0 0 10px #00ff00, 0 0 20px #00ff00;
            letter-spacing: 2px;
        }
        
        .login-header p {
            margin: 10px 0 0 0;
            color: #ff0000;
            text-shadow: 0 0 5px #ff0000;
            font-weight: 600;
        }
        
        .login-body {
            padding: 40px 30px;
            background: #1a1a1a;
        }
        
        .form-label {
            font-weight: 600;
            color: #00ff00;
            margin-bottom: 8px;
            text-transform: uppercase;
            font-size: 0.9rem;
            letter-spacing: 1px;
        }
        
        .form-control, .form-select {
            border-radius: 10px;
            padding: 12px 15px;
            border: 2px solid #333;
            background: #0a0a0a;
            color: #00ff00;
            transition: all 0.3s ease;
        }

        .form-control::placeholder {
            color: #555;
        }

        .form-control option {
            background: #0a0a0a;
            color: #00ff00;
        }
        
        .form-control:focus, .form-select:focus {
            border-color: #ff0000;
            box-shadow: 0 0 0 0.2rem rgba(255, 0, 0, 0.25), 0 0 20px rgba(255, 0, 0, 0.3);
            background: #0a0a0a;
            color: #00ff00;
        }
        
        .btn-login {
            background: linear-gradient(135deg, #ff0000 0%, #cc0000 100%);
            border: 2px solid #ff0000;
            border-radius: 10px;
            padding: 14px;
            font-weight: 700;
            font-size: 1.1rem;
            width: 100%;
            color: #000;
            transition: all 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 2px;
            position: relative;
            overflow: hidden;
        }

        .btn-login::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.3), transparent);
            transition: left 0.5s;
        }

        .btn-login:hover::before {
            left: 100%;
        }
        
        .btn-login:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(255, 0, 0, 0.5), 0 0 30px rgba(255, 0, 0, 0.3);
            background: linear-gradient(135deg, #cc0000 0%, #ff0000 100%);
            border-color: #ff0000;
            color: #fff;
        }
        
        .info-box {
            background: #0a0a0a;
            border-radius: 10px;
            padding: 20px;
            margin-top: 20px;
            border: 1px solid #333;
            border-left: 4px solid #00ff00;
        }
        
        .info-box h6 {
            font-weight: 700;
            color: #00ff00;
            margin-bottom: 10px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        
        .info-box p {
            margin: 5px 0;
            font-size: 0.9rem;
            color: #888;
        }

        .info-box strong {
            color: #ff0000;
        }

        .info-box code {
            background: #000;
            color: #00ff00;
            padding: 2px 8px;
            border-radius: 4px;
            border: 1px solid #333;
            font-family: 'Courier New', monospace;
        }
        
        .alert-custom {
            border-radius: 10px;
            margin-bottom: 20px;
            background: #0a0a0a;
            border: 1px solid;
        }

        .alert-success {
            border-color: #00ff00;
            color: #00ff00;
        }

        .alert-danger {
            border-color: #ff0000;
            color: #ff0000;
        }

        /* Cyber grid animation */
        .cyber-grid {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            opacity: 0.1;
            z-index: 1;
        }

        .form-select {
            background-image: url("data:image/svg+xml,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3e%3cpath fill='none' stroke='%2300ff00' stroke-linecap='round' stroke-linejoin='round' stroke-width='2' d='M2 5l6 6 6-6'/%3e%3c/svg%3e");
        }
    
        /* Remove number input arrows completely */
        input[type="number"]::-webkit-inner-spin-button,
        input[type="number"]::-webkit-outer-spin-button {
            -webkit-appearance: none;
            margin: 0;
            display: none;
        }

        input[type="number"] {
            -moz-appearance: textfield;
            appearance: textfield;
        }

        /* Encrypted data stream background */
        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: 
                repeating-linear-gradient(
                    0deg,
                    transparent,
                    transparent 2px,
                    rgba(0, 255, 0, 0.03) 2px,
                    rgba(0, 255, 0, 0.03) 4px
                );
            pointer-events: none;
            z-index: 1;
            opacity: 0.5;
        }

        body::after {
            content: '⚡ ENCRYPTED STREAM: 0x7F4A9B2E | 0x3D8C1F5A | 0x9E2B7C4D | 0x5A1F8E3B | 0x2C9D4A7E | 0x8B3F1C5D | 0x4E7A2D9B | 0x1C5F8A3E | 0x7D9B2C4A | 0x3E1F5A8D | SECURE CONNECTION | AES-256 ENCRYPTION | STATUS: ACTIVE ⚡';
            position: fixed;
            bottom: 0;
            left: 0;
            width: 200%;
            font-family: 'Courier New', monospace;
            font-size: 10px;
            color: rgba(0, 255, 0, 0.3);
            white-space: nowrap;
            overflow: hidden;
            padding: 10px;
            background: rgba(0, 0, 0, 0.8);
            border-top: 1px solid rgba(0, 255, 0, 0.3);
            animation: scrollText 25s linear infinite;
            pointer-events: none;
            z-index: 1;
        }

        @keyframes scrollText {
            0% { transform: translateX(0); }
            100% { transform: translateX(-50%); }
        }

        .main-container, .login-container {
            position: relative;
            z-index: 10;
        }

        /* Encrypted background pattern for inputs */
        .form-control,
        .form-select,
        textarea {
            position: relative;
            background: 
                linear-gradient(90deg, #0a0a0a 0%, #0d0d0d 50%, #0a0a0a 100%),
                repeating-linear-gradient(
                    90deg,
                    transparent,
                    transparent 8px,
                    rgba(0, 255, 0, 0.03) 8px,
                    rgba(0, 255, 0, 0.03) 9px
                ),
                repeating-linear-gradient(
                    0deg,
                    transparent,
                    transparent 8px,
                    rgba(255, 0, 0, 0.02) 8px,
                    rgba(255, 0, 0, 0.02) 9px
                );
            background-size: 100% 100%, 16px 100%, 100% 16px;
            overflow: hidden;
        }

        .form-control::after,
        .form-select::after,
        textarea::after {
            content: '01001000 01100101 01101100 01101100 01101111 01010111 01101111 01110010 01101100 01100100';
            position: absolute;
            top: 50%;
            left: 0;
            transform: translateY(-50%);
            font-family: 'Courier New', monospace;
            font-size: 8px;
            color: rgba(0, 255, 0, 0.05);
            pointer-events: none;
            white-space: nowrap;
            z-index: 0;
        }

        /* Matrix rain effect on cards */
        .card::before {
            content: '';
            position: absolute;
            top: -2px;
            left: -2px;
            right: -2px;
            bottom: -2px;
            background: linear-gradient(45deg, 
                rgba(255, 0, 0, 0.1), 
                rgba(0, 255, 0, 0.1), 
                rgba(255, 0, 0, 0.1));
            border-radius: 15px;
            opacity: 0;
            transition: opacity 0.3s;
            z-index: -1;
            filter: blur(10px);
        }

        .card:hover::before {
            opacity: 0.2;
            animation: borderPulse 2s ease-in-out infinite;
        }

        @keyframes borderPulse {
            0%, 100% { opacity: 0.2; }
            50% { opacity: 0.4; }
        }

        /* Encrypted text overlay on navbar */
        .navbar-custom::after {
            content: '[ 🔒 SECURE CONNECTION ] [ ENCRYPTION: AES-256 ] [ STATUS: ✅ ACTIVE ]';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            font-family: 'Courier New', monospace;
            font-size: 8px;
            color: rgba(0, 255, 0, 0.25);
            text-align: center;
            padding: 2px;
            pointer-events: none;
            background: rgba(0, 0, 0, 0.5);
            border-bottom: 1px solid rgba(0, 255, 0, 0.1);
        }

        .navbar-custom {
            position: relative;
            padding-top: 25px !important;
        }

        /* Glitch effect for logo */
        @keyframes glitch {
            0% { transform: translate(0); }
            20% { transform: translate(-1px, 1px); }
            40% { transform: translate(-1px, -1px); }
            60% { transform: translate(1px, 1px); }
            80% { transform: translate(1px, -1px); }
            100% { transform: translate(0); }
        }

        .logo-nav:hover svg {
            animation: glitch 0.3s ease-in-out;
        }

        /* Scan line effect */
        @keyframes scan {
            0% { top: 0; }
            100% { top: 100%; }
        }

        .login-card::after,
        .card::after {
            content: '';
            position: absolute;
            left: 0;
            top: 0;
            width: 100%;
            height: 2px;
            background: linear-gradient(90deg, 
                transparent, 
                rgba(0, 255, 0, 0.5), 
                transparent);
            animation: scan 3s linear infinite;
            pointer-events: none;
            z-index: 100;
        }

        /* Add position relative to cards */
        .card, .login-card {
            position: relative;
            overflow: hidden;
        }

        /* Hex code background pattern */
        .empty-state::before {
            content: 'HEX: 0xFF0000 | RGB: (255,0,0) | HEX: 0x00FF00 | RGB: (0,255,0) | STATUS: WAITING FOR DATA INPUT';
            position: absolute;
            width: 100%;
            text-align: center;
            font-family: 'Courier New', monospace;
            font-size: 9px;
            color: rgba(0, 255, 0, 0.15);
            top: 30%;
            left: 0;
            pointer-events: none;
        }

        .empty-state {
            position: relative;
        }

    </style>
</head>
<body>
    <div class="login-container">
        <div class="login-card">
            <div class="login-header">
                <div class="logo-container">
                    <div class="logo">
                        <svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
                            <!-- Shield outline -->
                            <path d="M50 10 L80 25 L80 50 Q80 75 50 90 Q20 75 20 50 L20 25 Z" 
                                  fill="none" stroke="#00ff00" stroke-width="3"/>
                            <!-- Inner shield -->
                            <path d="M50 15 L75 27 L75 50 Q75 70 50 83 Q25 70 25 50 L25 27 Z" 
                                  fill="#1a0000" stroke="#ff0000" stroke-width="2"/>
                            <!-- Fingerprint lines -->
                            <ellipse cx="50" cy="50" rx="15" ry="20" fill="none" stroke="#00ff00" stroke-width="1.5"/>
                            <ellipse cx="50" cy="50" rx="10" ry="15" fill="none" stroke="#ff0000" stroke-width="1.5"/>
                            <ellipse cx="50" cy="50" rx="5" ry="10" fill="none" stroke="#00ff00" stroke-width="1.5"/>
                            <!-- Lock symbol -->
                            <rect x="46" y="55" width="8" height="10" fill="#ff0000" rx="1"/>
                            <rect x="45" y="48" width="10" height="8" fill="none" stroke="#00ff00" stroke-width="2" rx="4"/>
                        </svg>
                    </div>
                </div>
                <h2>🔐 SYSTEM ACCESS</h2>
                <p>Criminal Investigation & Suspect Detection</p>
            </div>
            
            <div class="login-body">
                <div id="alertBox"></div>
                
                <form id="loginForm">
                    <div class="mb-4">
                        <label for="userRole" class="form-label">◆ Select Role</label>
                        <select class="form-select" id="userRole" required>
                            <option value="">Choose your role...</option>
                            <option value="admin">👨‍💼 Admin</option>
                            <option value="officer">👮 Officer</option>
                        </select>
                    </div>
                    
                    <div class="mb-4">
                        <label for="username" class="form-label">◆ Username</label>
                        <input type="text" class="form-control" id="username" placeholder="Enter username" required>
                    </div>
                    
                    <div class="mb-4">
                        <label for="password" class="form-label">◆ Password</label>
                        <input type="password" class="form-control" id="password" placeholder="Enter password" required>
                    </div>
                    
                    <button type="submit" class="btn btn-login">
                        ⚡ Login
                    </button>
                </form>
                
                <div class="info-box">
                    <h6>📋 Demo Credentials</h6>
                    <p><strong>Admin:</strong> Username: <code>admin</code> | Password: <code>admin123</code></p>
                    <p><strong>Officer:</strong> Username: <code>officer</code> | Password: <code>officer123</code></p>
                </div>
            </div>
        </div>
    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    
    <!-- Custom JavaScript -->
    <script>
        // Predefined credentials
        const credentials = {
            admin: {
                username: 'admin',
                password: 'admin123',
                role: 'admin'
            },
            officer: {
                username: 'officer',
                password: 'officer123',
                role: 'officer'
            }
        };

        // Function to show alert
        function showAlert(message, type) {
            const alertBox = document.getElementById('alertBox');
            alertBox.innerHTML = `
                <div class="alert alert-${type} alert-custom alert-dismissible fade show" role="alert">
                    ${message}
                    <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                </div>
            `;
        }

        // Form submission handler
        document.getElementById('loginForm').addEventListener('submit', function(e) {
            e.preventDefault();
            
            const role = document.getElementById('userRole').value;
            const username = document.getElementById('username').value.trim();
            const password = document.getElementById('password').value.trim();
            
            // Validate credentials
            if (role === 'admin' && username === credentials.admin.username && password === credentials.admin.password) {
                // Admin login successful
                showAlert('✅ Admin login successful! Redirecting...', 'success');
                
                // Store session
                sessionStorage.setItem('userRole', 'admin');
                sessionStorage.setItem('username', username);
                sessionStorage.setItem('isLoggedIn', 'true');
                
                // Redirect to admin dashboard
                setTimeout(() => {
                    window.location.href = 'add_suspect.html';
                }, 1500);
                
            } else if (role === 'officer' && username === credentials.officer.username && password === credentials.officer.password) {
                // Officer login successful
                showAlert('✅ Officer login successful! Redirecting...', 'success');
                
                // Store session
                sessionStorage.setItem('userRole', 'officer');
                sessionStorage.setItem('username', username);
                sessionStorage.setItem('isLoggedIn', 'true');
                
                // Redirect to officer view
                setTimeout(() => {
                    window.location.href = 'view_suspects.html';
                }, 1500);
                
            } else {
                // Login failed
                showAlert('❌ Invalid credentials! Please check your username, password, and selected role.', 'danger');
            }
        });

        // Clear any existing session on page load
        window.onload = function() {
            // Optional: Uncomment to clear session on login page load
            // sessionStorage.clear();
        };
    </script>
</body>
</html>
