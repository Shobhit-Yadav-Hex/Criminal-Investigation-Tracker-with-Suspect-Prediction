        /* Encrypted data stream background */
        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: 
                repeating-linear-gradient(
                    0deg,
                    transparent,
                    transparent 2px,
                    rgba(0, 255, 0, 0.03) 2px,
                    rgba(0, 255, 0, 0.03) 4px
                );
            pointer-events: none;
            z-index: 1;
            opacity: 0.5;
        }

        body::after {
            content: '⚡ ENCRYPTED STREAM: 0x7F4A9B2E | 0x3D8C1F5A | 0x9E2B7C4D | 0x5A1F8E3B | 0x2C9D4A7E | 0x8B3F1C5D | 0x4E7A2D9B | 0x1C5F8A3E | 0x7D9B2C4A | 0x3E1F5A8D | SECURE CONNECTION | AES-256 ENCRYPTION | STATUS: ACTIVE ⚡';
            position: fixed;
            bottom: 0;
            left: 0;
            width: 200%;
            font-family: 'Courier New', monospace;
            font-size: 10px;
            color: rgba(0, 255, 0, 0.3);
            white-space: nowrap;
            overflow: hidden;
            padding: 10px;
            background: rgba(0, 0, 0, 0.8);
            border-top: 1px solid rgba(0, 255, 0, 0.3);
            animation: scrollText 25s linear infinite;
            pointer-events: none;
            z-index: 1;
        }

        @keyframes scrollText {
            0% { transform: translateX(0); }
            100% { transform: translateX(-50%); }
        }

        .main-container, .login-container {
            position: relative;
            z-index: 10;
        }

        /* Encrypted background pattern for inputs */
        .form-control,
        .form-select,
        textarea {
            position: relative;
            background: 
                linear-gradient(90deg, #0a0a0a 0%, #0d0d0d 50%, #0a0a0a 100%),
                repeating-linear-gradient(
                    90deg,
                    transparent,
                    transparent 8px,
                    rgba(0, 255, 0, 0.03) 8px,
                    rgba(0, 255, 0, 0.03) 9px
                ),
                repeating-linear-gradient(
                    0deg,
                    transparent,
                    transparent 8px,
                    rgba(255, 0, 0, 0.02) 8px,
                    rgba(255, 0, 0, 0.02) 9px
                );
            background-size: 100% 100%, 16px 100%, 100% 16px;
            overflow: hidden;
        }

        .form-control::after,
        .form-select::after,
        textarea::after {
            content: '01001000 01100101 01101100 01101100 01101111 01010111 01101111 01110010 01101100 01100100';
            position: absolute;
            top: 50%;
            left: 0;
            transform: translateY(-50%);
            font-family: 'Courier New', monospace;
            font-size: 8px;
            color: rgba(0, 255, 0, 0.05);
            pointer-events: none;
            white-space: nowrap;
            z-index: 0;
        }

        /* Matrix rain effect on cards */
        .card::before {
            content: '';
            position: absolute;
            top: -2px;
            left: -2px;
            right: -2px;
            bottom: -2px;
            background: linear-gradient(45deg, 
                rgba(255, 0, 0, 0.1), 
                rgba(0, 255, 0, 0.1), 
                rgba(255, 0, 0, 0.1));
            border-radius: 15px;
            opacity: 0;
            transition: opacity 0.3s;
            z-index: -1;
            filter: blur(10px);
        }

        .card:hover::before {
            opacity: 0.2;
            animation: borderPulse 2s ease-in-out infinite;
        }

        @keyframes borderPulse {
            0%, 100% { opacity: 0.2; }
            50% { opacity: 0.4; }
        }

        /* Encrypted text overlay on navbar */
        .navbar-custom::after {
            content: '[ 🔒 SECURE CONNECTION ] [ ENCRYPTION: AES-256 ] [ STATUS: ✅ ACTIVE ]';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            font-family: 'Courier New', monospace;
            font-size: 8px;
            color: rgba(0, 255, 0, 0.25);
            text-align: center;
            padding: 2px;
            pointer-events: none;
            background: rgba(0, 0, 0, 0.5);
            border-bottom: 1px solid rgba(0, 255, 0, 0.1);
        }

        .navbar-custom {
            position: relative;
            padding-top: 25px !important;
        }

        /* Glitch effect for logo */
        @keyframes glitch {
            0% { transform: translate(0); }
            20% { transform: translate(-1px, 1px); }
            40% { transform: translate(-1px, -1px); }
            60% { transform: translate(1px, 1px); }
            80% { transform: translate(1px, -1px); }
            100% { transform: translate(0); }
        }

        .logo-nav:hover svg {
            animation: glitch 0.3s ease-in-out;
        }

        /* Scan line effect */
        @keyframes scan {
            0% { top: 0; }
            100% { top: 100%; }
        }

        .login-card::after,
        .card::after {
            content: '';
            position: absolute;
            left: 0;
            top: 0;
            width: 100%;
            height: 2px;
            background: linear-gradient(90deg, 
                transparent, 
                rgba(0, 255, 0, 0.5), 
                transparent);
            animation: scan 3s linear infinite;
            pointer-events: none;
            z-index: 100;
        }

        /* Add position relative to cards */
        .card, .login-card {
            position: relative;
            overflow: hidden;
        }

        /* Hex code background pattern */
        .empty-state::before {
            content: 'HEX: 0xFF0000 | RGB: (255,0,0) | HEX: 0x00FF00 | RGB: (0,255,0) | STATUS: WAITING FOR DATA INPUT';
            position: absolute;
            width: 100%;
            text-align: center;
            font-family: 'Courier New', monospace;
            font-size: 9px;
            color: rgba(0, 255, 0, 0.15);
            top: 30%;
            left: 0;
            pointer-events: none;
        }

        .empty-state {
            position: relative;
        }

    </style>
</head>

    <script>
        let userRole = '';
        let suspects = [];
        let predictionCount = parseInt(localStorage.getItem('predictionCount')) || 0;

        window.onload = function() {
            const isLoggedIn = sessionStorage.getItem('isLoggedIn');
            userRole = sessionStorage.getItem('userRole');
            const username = sessionStorage.getItem('username');
            
            if (!isLoggedIn) {
                window.location.href = 'login.html';
                return;
            }
            
            document.getElementById('userName').textContent = username;
            
            if (userRole === 'admin') {
                document.getElementById('userIcon').textContent = '👨‍💼';
                document.getElementById('userRole').textContent = 'ADMIN';
                document.getElementById('userRole').style.background = '#dc3545';
            } else {
                document.getElementById('userIcon').textContent = '👮';
                document.getElementById('userRole').textContent = 'OFFICER';
            }
            
            buildNavigation();
            loadSuspects();
            calculateStats();
        };

            const navMenu = document.getElementById('navMenu');

                    </li>
                    <li class="nav-item">

                    </li>
                `;
            } else {
                navHTML = `
                    <li class="nav-item">
                        <a class="nav-link" href="view_suspects.html">👁️ View Suspects</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link active" href="predict_suspect.html">🎯 Predict Suspect</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="history.html">📜 View History</a>
                    </li>
                `;
            }
            
            navMenu.innerHTML = navHTML;
        }

        function logout() {
            if (confirm('Are you sure you want to logout?')) {
                sessionStorage.clear();
                window.location.href = 'login.html';
            }
        }

        function loadSuspects() {
            suspects = JSON.parse(localStorage.getItem('suspects')) || [];
        }

        function calculateStats() {
            document.getElementById('totalSuspects').textContent = suspects.length;
            const withCrimes = suspects.filter(s => s.crime).length;
            document.getElementById('totalCrimes').textContent = withCrimes;
            
            if (suspects.length > 0) {
                const avgAge = Math.round(suspects.reduce((sum, s) => sum + parseInt(s.age), 0) / suspects.length);
                document.getElementById('avgAge').textContent = avgAge;
            }
            
            document.getElementById('predictions').textContent = predictionCount;
        }

        function isInAgeRange(age, range) {
            if (!range) return true;
            const [min, max] = range.split('-').map(n => parseInt(n));
            return age >= min && age <= max;
        }

        function predictSuspects(crimeType, location, ageRange, gender) {
            let matches = [];

            suspects.forEach((suspect, index) => {
                let score = 0;

                if (suspect.crime && suspect.crime === crimeType) {
                    score += 50;
                }

                if (ageRange && isInAgeRange(parseInt(suspect.age), ageRange)) {
                    score += 25;
                }

                if (gender && suspect.gender === gender) {
                    score += 15;
                }

                if (location && suspect.address && 
                    suspect.address.toLowerCase().includes(location.toLowerCase())) {
                    score += 10;
                }

                if (score > 0) {
                    matches.push({
                        suspect: suspect,
                        index: index,
                        score: score,
                        matchPercentage: Math.min(score, 100)
                    });
                }
            });

            matches.sort((a, b) => b.score - a.score);
            return matches;
        }

        function displayResults(matches, crimeType, location) {
            const resultsDiv = document.getElementById('predictionResults');
            const resultsCard = document.getElementById('resultsCard');

            if (matches.length === 0) {
                resultsDiv.innerHTML = `
                    <div class="alert alert-warning">
                        <h5>⚠️ No Matching Suspects Found</h5>
                        <p>No suspects in the database match the provided crime pattern criteria.</p>
                    </div>
                `;
            } else {
                let html = `
                    <div class="alert alert-success">
                        <h5>✅ Analysis Complete!</h5>
                        <p class="mb-0">Found <strong>${matches.length}</strong> potential suspect(s) for <strong>${crimeType}</strong></p>
                    </div>
                `;

                matches.forEach((match, i) => {
                    const badgeColor = match.matchPercentage >= 70 ? 'danger' : 
                                      match.matchPercentage >= 40 ? 'warning' : 'info';
                    
                    html += `
                        <div class="card match-card">
                            <div class="card-body">
                                <div class="d-flex justify-content-between align-items-start mb-2">
                                    <h5 class="card-title mb-0">
                                        <span class="badge bg-dark">Rank #${i + 1}</span>
                                        ${match.suspect.name}
                                    </h5>
                                    <span class="badge bg-${badgeColor}" style="font-size: 1rem;">
                                        ${match.matchPercentage}% Match
                                    </span>
                                </div>
                                
                                <div class="row mt-3">
                                    <div class="col-md-6">
                                        <p class="mb-1"><strong>Age:</strong> ${match.suspect.age} years</p>
                                        <p class="mb-1"><strong>DOB:</strong> ${new Date(match.suspect.dob).toLocaleDateString()}</p>
                                        ${match.suspect.gender ? `<p class="mb-1"><strong>Gender:</strong> ${match.suspect.gender}</p>` : ''}
                                    </div>
                                    <div class="col-md-6">
                                        ${match.suspect.crime ? `<p class="mb-1"><strong>Previous Crime:</strong> <span class="badge bg-danger">${match.suspect.crime}</span></p>` : ''}
                                        ${match.suspect.address ? `<p class="mb-1"><strong>Address:</strong> ${match.suspect.address}</p>` : ''}
                                    </div>
                                </div>
                                
                                ${match.suspect.description ? `
                                    <div class="mt-2">
                                        <strong>Notes:</strong>
                                        <p class="text-muted mb-0">${match.suspect.description}</p>
                                    </div>
                                ` : ''}
                            </div>
                        </div>
                    `;
                });

                resultsDiv.innerHTML = html;
            }

            resultsCard.style.display = 'block';
            resultsCard.scrollIntoView({ behavior: 'smooth' });
        }

        document.getElementById('predictionForm').addEventListener('submit', function(e) {
            e.preventDefault();

            const crimeType = document.getElementById('crimeType').value;
            const location = document.getElementById('crimeLocation').value;
            const ageRange = document.getElementById('suspectAgeRange').value;
            const gender = document.getElementById('suspectGenderPred').value;

            const matches = predictSuspects(crimeType, location, ageRange, gender);
            displayResults(matches, crimeType, location);

            // Add to history
            let history = JSON.parse(localStorage.getItem('history')) || [];
            history.push({
                action: 'PREDICTION',
                suspectName: 'System',
                details: `Predicted suspects for ${crimeType} crime. Found ${matches.length} match(es).`,
                timestamp: new Date().toISOString(),
                user: sessionStorage.getItem('username')
            });
            localStorage.setItem('history', JSON.stringify(history));

            predictionCount++;
            localStorage.setItem('predictionCount', predictionCount);
            calculateStats();
        });
    </script>
</body>
</html>
