        /* Encrypted data stream background */
        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: 
                repeating-linear-gradient(
                    0deg,
                    transparent,
                    transparent 2px,
                    rgba(0, 255, 0, 0.03) 2px,
                    rgba(0, 255, 0, 0.03) 4px
                );
            pointer-events: none;
            z-index: 1;
            opacity: 0.5;
        }

        body::after {
            content: '⚡ ENCRYPTED STREAM: 0x7F4A9B2E | 0x3D8C1F5A | 0x9E2B7C4D | 0x5A1F8E3B | 0x2C9D4A7E | 0x8B3F1C5D | 0x4E7A2D9B | 0x1C5F8A3E | 0x7D9B2C4A | 0x3E1F5A8D | SECURE CONNECTION | AES-256 ENCRYPTION | STATUS: ACTIVE ⚡';
            position: fixed;
            bottom: 0;
            left: 0;
            width: 200%;
            font-family: 'Courier New', monospace;
            font-size: 10px;
            color: rgba(0, 255, 0, 0.3);
            white-space: nowrap;
            overflow: hidden;
            padding: 10px;
            background: rgba(0, 0, 0, 0.8);
            border-top: 1px solid rgba(0, 255, 0, 0.3);
            animation: scrollText 25s linear infinite;
            pointer-events: none;
            z-index: 1;
        }

        @keyframes scrollText {
            0% { transform: translateX(0); }
            100% { transform: translateX(-50%); }
        }

        .main-container, .login-container {
            position: relative;
            z-index: 10;
        }

        /* Encrypted background pattern for inputs */
        .form-control,
        .form-select,
        textarea {
            position: relative;
            background: 
                linear-gradient(90deg, #0a0a0a 0%, #0d0d0d 50%, #0a0a0a 100%),
                repeating-linear-gradient(
                    90deg,
                    transparent,
                    transparent 8px,
                    rgba(0, 255, 0, 0.03) 8px,
                    rgba(0, 255, 0, 0.03) 9px
                ),
                repeating-linear-gradient(
                    0deg,
                    transparent,
                    transparent 8px,
                    rgba(255, 0, 0, 0.02) 8px,
                    rgba(255, 0, 0, 0.02) 9px
                );
            background-size: 100% 100%, 16px 100%, 100% 16px;
            overflow: hidden;
        }

        .form-control::after,
        .form-select::after,
        textarea::after {
            content: '01001000 01100101 01101100 01101100 01101111 01010111 01101111 01110010 01101100 01100100';
            position: absolute;
            top: 50%;
            left: 0;
            transform: translateY(-50%);
            font-family: 'Courier New', monospace;
            font-size: 8px;
            color: rgba(0, 255, 0, 0.05);
            pointer-events: none;
            white-space: nowrap;
            z-index: 0;
        }

        /* Matrix rain effect on cards */
        .card::before {
            content: '';
            position: absolute;
            top: -2px;
            left: -2px;
            right: -2px;
            bottom: -2px;
            background: linear-gradient(45deg, 
                rgba(255, 0, 0, 0.1), 
                rgba(0, 255, 0, 0.1), 
                rgba(255, 0, 0, 0.1));
            border-radius: 15px;
            opacity: 0;
            transition: opacity 0.3s;
            z-index: -1;
            filter: blur(10px);
        }

        .card:hover::before {
            opacity: 0.2;
            animation: borderPulse 2s ease-in-out infinite;
        }

        @keyframes borderPulse {
            0%, 100% { opacity: 0.2; }
            50% { opacity: 0.4; }
        }

        /* Encrypted text overlay on navbar */
        .navbar-custom::after {
            content: '[ 🔒 SECURE CONNECTION ] [ ENCRYPTION: AES-256 ] [ STATUS: ✅ ACTIVE ]';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            font-family: 'Courier New', monospace;
            font-size: 8px;
            color: rgba(0, 255, 0, 0.25);
            text-align: center;
            padding: 2px;
            pointer-events: none;
            background: rgba(0, 0, 0, 0.5);
            border-bottom: 1px solid rgba(0, 255, 0, 0.1);
        }

        .navbar-custom {
            position: relative;
            padding-top: 25px !important;
        }

        /* Glitch effect for logo */
        @keyframes glitch {
            0% { transform: translate(0); }
            20% { transform: translate(-1px, 1px); }
            40% { transform: translate(-1px, -1px); }
            60% { transform: translate(1px, 1px); }
            80% { transform: translate(1px, -1px); }
            100% { transform: translate(0); }
        }

        .logo-nav:hover svg {
            animation: glitch 0.3s ease-in-out;
        }

        /* Scan line effect */
        @keyframes scan {
            0% { top: 0; }
            100% { top: 100%; }
        }

        .login-card::after,
        .card::after {
            content: '';
            position: absolute;
            left: 0;
            top: 0;
            width: 100%;
            height: 2px;
            background: linear-gradient(90deg, 
                transparent, 
                rgba(0, 255, 0, 0.5), 
                transparent);
            animation: scan 3s linear infinite;
            pointer-events: none;
            z-index: 100;
        }

        /* Add position relative to cards */
        .card, .login-card {
            position: relative;
            overflow: hidden;
        }

        /* Hex code background pattern */
        .empty-state::before {
            content: 'HEX: 0xFF0000 | RGB: (255,0,0) | HEX: 0x00FF00 | RGB: (0,255,0) | STATUS: WAITING FOR DATA INPUT';
            position: absolute;
            width: 100%;
            text-align: center;
            font-family: 'Courier New', monospace;
            font-size: 9px;
            color: rgba(0, 255, 0, 0.15);
            top: 30%;
            left: 0;
            pointer-events: none;
        }

        .empty-state {
            position: relative;
        }

    </style>
</head>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    
    <script>
        let userRole = '';
        let allHistory = [];
        let displayedHistory = [];

        window.onload = function() {
            const isLoggedIn = sessionStorage.getItem('isLoggedIn');
            userRole = sessionStorage.getItem('userRole');
            const username = sessionStorage.getItem('username');
            
            if (!isLoggedIn) {
                window.location.href = 'login.html';
                return;
            }
            
            document.getElementById('userName').textContent = username;
            
            if (userRole === 'admin') {
                document.getElementById('userIcon').textContent = '👨‍💼';
                document.getElementById('userRole').textContent = 'ADMIN';
                document.getElementById('userRole').style.background = '#dc3545';
            } else {
                document.getElementById('userIcon').textContent = '👮';
                document.getElementById('userRole').textContent = 'OFFICER';
            }
            
            buildNavigation();
            loadHistory();
        };

        function buildNavigation() {
            const navMenu = document.getElementById('navMenu');
            let navHTML = '';
            
            if (userRole === 'admin') {
                navHTML = `
                    <li class="nav-item">
                        <a class="nav-link" href="add_suspect.html">📝 Add Suspect</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="view_suspects.html">👁️ View Suspects</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="predict_suspect.html">🎯 Predict Suspect</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="view_evidence.html">📁 View Evidence</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link active" href="history.html">📜 View History</a>
                    </li>
                `;
            } else {
                navHTML = `
                    <li class="nav-item">
                        <a class="nav-link" href="view_suspects.html">👁️ View Suspects</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="predict_suspect.html">🎯 Predict Suspect</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="view_evidence.html">📁 View Evidence</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link active" href="history.html">📜 View History</a>
                    </li>
                `;
            }
            
            navMenu.innerHTML = navHTML;
        }

        function logout() {
            if (confirm('Are you sure you want to logout?')) {
                sessionStorage.clear();
                window.location.href = 'login.html';
            }
        }

        function loadHistory() {
            allHistory = JSON.parse(localStorage.getItem('history')) || [];
            // Sort by newest first
            allHistory.sort((a, b) => new Date(b.timestamp) - new Date(a.timestamp));
            displayedHistory = [...allHistory];
            
            // Populate user filter
            const users = [...new Set(allHistory.map(h => h.user))];
            const userFilter = document.getElementById('filterUser');
            users.forEach(user => {
                const option = document.createElement('option');
                option.value = user;
                option.textContent = user;
                userFilter.appendChild(option);
            });
            
            displayHistory();
            calculateStats();
        }

        function calculateStats() {
            document.getElementById('totalEvents').textContent = displayedHistory.length;
            
            const adds = displayedHistory.filter(h => h.action === 'ADD').length;
            document.getElementById('totalAdds').textContent = adds;
            
            const deletes = displayedHistory.filter(h => h.action === 'DELETE').length;
            document.getElementById('totalDeletes').textContent = deletes;
            
            const predictions = displayedHistory.filter(h => h.action === 'PREDICTION').length;
            document.getElementById('totalPredictions').textContent = predictions;
        }

        function getActionIcon(action) {
            switch(action) {
                case 'ADD': return '✅';
                case 'DELETE': return '❌';
                case 'PREDICTION': return '🎯';
                case 'CLEAR_ALL': return '🗑️';
                default: return '📝';
            }
        }

        function getActionColor(action) {
            switch(action) {
                case 'ADD': return 'success';
                case 'DELETE': return 'danger';
                case 'PREDICTION': return 'warning';
                case 'CLEAR_ALL': return 'secondary';
                default: return 'info';
            }
        }

        function getActionClass(action) {
            switch(action) {
                case 'ADD': return 'add';
                case 'DELETE': return 'delete';
                case 'PREDICTION': return 'prediction';
                case 'CLEAR_ALL': return 'clear';
                default: return '';
            }
        }

        function displayHistory() {
            const historyList = document.getElementById('historyList');
            
            if (displayedHistory.length === 0) {
                historyList.innerHTML = `
                    <div class="empty-state">
                        <div>📝</div>
                        <h5>No activity found</h5>
                        <p>No records match the current filters</p>
                    </div>
                `;
                calculateStats();
                return;
            }

            let html = '';
            
            displayedHistory.forEach((entry, index) => {
                const date = new Date(entry.timestamp);
                const formattedDate = date.toLocaleString('en-US', {
                    year: 'numeric',
                    month: 'long',
                    day: 'numeric',
                    hour: '2-digit',
                    minute: '2-digit',
                    second: '2-digit'
                });
                
                html += `
                    <div class="history-item ${getActionClass(entry.action)}">
                        <div class="d-flex justify-content-between align-items-start mb-2">
                            <div>
                                <h6 class="mb-1">
                                    ${getActionIcon(entry.action)}
                                    <span class="action-badge bg-${getActionColor(entry.action)} text-white">${entry.action}</span>
                                    <span class="ms-2"><strong>${entry.suspectName}</strong></span>
                                </h6>
                                <p class="mb-1 text-muted">${entry.details}</p>
                            </div>
                        </div>
                        <div class="d-flex justify-content-between align-items-center">
                            <small class="text-muted">
                                <strong>User:</strong> ${entry.user}
                            </small>
                            <small class="text-muted">
                                <strong>Time:</strong> ${formattedDate}
                            </small>
                        </div>
                    </div>
                `;
            });
            
            historyList.innerHTML = html;
            calculateStats();
        }

        function applyFilters() {
            const actionFilter = document.getElementById('filterAction').value;
            const userFilter = document.getElementById('filterUser').value;
            const suspectSearch = document.getElementById('searchSuspect').value.toLowerCase();
            
            displayedHistory = allHistory.filter(entry => {
                let matches = true;
                
                if (actionFilter && entry.action !== actionFilter) {
                    matches = false;
                }
                
                if (userFilter && entry.user !== userFilter) {
                    matches = false;
                }
                
                if (suspectSearch && !entry.suspectName.toLowerCase().includes(suspectSearch)) {
                    matches = false;
                }
                
                return matches;
            });
            
            displayHistory();
        }

        function resetFilters() {
            document.getElementById('filterAction').value = '';
            document.getElementById('filterUser').value = '';
            document.getElementById('searchSuspect').value = '';
            displayedHistory = [...allHistory];
            displayHistory();
        }

        function clearHistory() {
            if (confirm('⚠️ Are you sure you want to clear ALL history records? This cannot be undone!')) {
                localStorage.setItem('history', JSON.stringify([]));
                allHistory = [];
                displayedHistory = [];
                displayHistory();
                alert('History has been cleared.');
            }
        }

        // Auto-refresh every 30 seconds
        setInterval(() => {
            loadHistory();
        }, 30000);
    </script>
</body>
</html>
