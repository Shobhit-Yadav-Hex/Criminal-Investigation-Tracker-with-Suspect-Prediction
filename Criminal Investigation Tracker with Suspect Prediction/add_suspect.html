        /* Remove number input arrows completely */

            margin: 0;

        }

        input[type="number"] {
            -moz-appearance: textfield;

        /* Encrypted data stream background */
        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: 
                repeating-linear-gradient(
                    0deg,
                    transparent,
                    transparent 2px,
                    rgba(0, 255, 0, 0.03) 2px,
                    rgba(0, 255, 0, 0.03) 4px
                );
            pointer-events: none;
            z-index: 1;
            opacity: 0.5;
        }

        body::after {
            content: '⚡ ENCRYPTED STREAM: 0x7F4A9B2E | 0x3D8C1F5A | 0x9E2B7C4D | 0x5A1F8E3B | 0x2C9D4A7E | 0x8B3F1C5D | 0x4E7A2D9B | 0x1C5F8A3E | 0x7D9B2C4A | 0x3E1F5A8D | SECURE CONNECTION | AES-256 ENCRYPTION | STATUS: ACTIVE ⚡';

            bottom: 0;
            left: 0;
            width: 200%;
            font-family: 'Courier New', monospace;
            font-size: 10px;
            color: rgba(0, 255, 0, 0.3);

            overflow: hidden;
            padding: 10px;
            background: rgba(0, 0, 0, 0.8);
            border-top: 1px solid rgba(0, 255, 0, 0.3);
            animation: scrollText 25s linear infinite;
            pointer-events: none;
            z-index: 1;
        }

        @keyframes scrollText {
            0% { transform: translateX(0); }
            100% { transform: translateX(-50%); }
        }

        .main-container, .login-container {
            position: relative;
            z-index: 10;
        }

        /* Encrypted background pattern for inputs */
        .form-control,
        .form-select,
        textarea {
            position: relative;
            background: 
                linear-gradient(90deg, #0a0a0a 0%, #0d0d0d 50%, #0a0a0a 100%),
                repeating-linear-gradient(
                    90deg,
                    transparent,
                    transparent 8px,
                    rgba(0, 255, 0, 0.03) 8px,
                    rgba(0, 255, 0, 0.03) 9px
                ),
                repeating-linear-gradient(
                    0deg,
                    transparent,
                    transparent 8px,
                    rgba(255, 0, 0, 0.02) 8px,
                    rgba(255, 0, 0, 0.02) 9px
                );
            background-size: 100% 100%, 16px 100%, 100% 16px;
            overflow: hidden;
        }

        .form-control::after,
        .form-select::after,
        textarea::after {
            content: '01001000 01100101 01101100 01101100 01101111 01010111 01101111 01110010 01101100 01100100';
            position: absolute;
            top: 50%;
            left: 0;
            transform: translateY(-50%);
            font-family: 'Courier New', monospace;
            font-size: 8px;
            color: rgba(0, 255, 0, 0.05);
            pointer-events: none;
            white-space: nowrap;
            z-index: 0;
        }

        /* Matrix rain effect on cards */
        .card::before {
            content: '';
            position: absolute;
            top: -2px;
            left: -2px;
            right: -2px;
            bottom: -2px;
            background: linear-gradient(45deg, 
                rgba(255, 0, 0, 0.1), 
                rgba(0, 255, 0, 0.1), 
                rgba(255, 0, 0, 0.1));
            border-radius: 15px;
            opacity: 0;
            transition: opacity 0.3s;
            z-index: -1;
            filter: blur(10px);
        }

        .card:hover::before {
            opacity: 0.2;
            animation: borderPulse 2s ease-in-out infinite;
        }

        @keyframes borderPulse {
            0%, 100% { opacity: 0.2; }
            50% { opacity: 0.4; }
        }

        /* Encrypted text overlay on navbar */
        .navbar-custom::after {
            content: '[ 🔒 SECURE CONNECTION ] [ ENCRYPTION: AES-256 ] [ STATUS: ✅ ACTIVE ]';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            font-family: 'Courier New', monospace;
            font-size: 8px;

            text-align: center;
            padding: 2px;
            pointer-events: none;
            background: rgba(0, 0, 0, 0.5);
            border-bottom: 1px solid rgba(0, 255, 0, 0.1);
        }

        .navbar-custom {
            position: relative;
            padding-top: 25px !important;
        }

        /* Glitch effect for logo */
        @keyframes glitch {
            0% { transform: translate(0); }
            20% { transform: translate(-1px, 1px); }
            40% { transform: translate(-1px, -1px); }
            60% { transform: translate(1px, 1px); }
            80% { transform: translate(1px, -1px); }
            100% { transform: translate(0); }
        }

        .logo-nav:hover svg {
            animation: glitch 0.3s ease-in-out;
        }

        /* Scan line effect */
        @keyframes scan {
            0% { top: 0; }
            100% { top: 100%; }
        }

        .login-card::after,
        .card::after {
            content: '';
            position: absolute;
            left: 0;
            top: 0;

        /* Image upload and preview styles */
        input[type="file"] {

        .image-preview-container {

        .image-preview {

        }

        .suspect-image-display {
            max-width: 100px;

        /* Modal styles for full image view */
        .image-modal {
            display: none;
            position: fixed;
            z-index: 10000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;

        }

        .image-modal-content {
            position: relative;
            margin: 5% auto;
            max-width: 90%;
            max-height: 90%;
        }

        .image-modal img {
            width: auto;

            border: 3px solid #00ff00;

            box-shadow: 0 0 50px rgba(0, 255, 0, 0.5);
        }

        .image-modal-close {
            position: absolute;
            top: -40px;
            right: 0;
            color: #ff0000;

            cursor: pointer;
            text-shadow: 0 0 10px #ff0000;

        }

        .image-modal-close:hover {
            color: #00ff00;
            text-shadow: 0 0 20px #00ff00;
            transform: rotate(90deg);
        }

    </style>
</head>

    <script>
        // Check if user is logged in as admin
        window.onload = function() {
            const isLoggedIn = sessionStorage.getItem('isLoggedIn');
            const userRole = sessionStorage.getItem('userRole');
            const username = sessionStorage.getItem('username');
            
            if (!isLoggedIn || userRole !== 'admin') {
                alert('⚠️ Access Denied! Admin access required.');
                window.location.href = 'login.html';
                return;
            }
            
            document.getElementById('adminName').textContent = username;
            displaySuspects();
        };

        // Logout function
        function logout() {
            if (confirm('Are you sure you want to logout?')) {
                sessionStorage.clear();
                window.location.href = 'login.html';
            }
        }

        // Get suspects from localStorage or initialize empty array
        let suspects = JSON.parse(localStorage.getItem('suspects')) || [];
        
        // Get history from localStorage or initialize empty array
        let history = JSON.parse(localStorage.getItem('history')) || [];

        // Function to add history entry
        function addHistory(action, suspectName, details = '') {
            const entry = {
                action: action,
                suspectName: suspectName,
                details: details,
                timestamp: new Date().toISOString(),
                user: sessionStorage.getItem('username') || 'Admin'
            };
            history.push(entry);
            localStorage.setItem('history', JSON.stringify(history));
        }

        // Function to save suspects to localStorage
        function saveSuspects() {
            localStorage.setItem('suspects', JSON.stringify(suspects));
        }

        // Function to format date
        function formatDate(dateString) {
            const options = { year: 'numeric', month: 'long', day: 'numeric' };
            return new Date(dateString).toLocaleDateString('en-US', options);
        }

        // Function to display all suspects
        function displaySuspects() {
            const suspectList = document.getElementById('suspectList');
            
            if (suspects.length === 0) {
                suspectList.innerHTML = `
                    <div class="empty-state">
                        <div>👮</div>
                        <h5>No suspects recorded yet</h5>
                        <p>Add suspect information using the form above</p>
                    </div>
                `;
                return;
            }

            // Show only last 6 suspects
            const recentSuspects = suspects.slice(-6).reverse();
            let html = '<div class="row">';
            
            recentSuspects.forEach((suspect, displayIndex) => {
                const actualIndex = suspects.length - 1 - displayIndex;
                const crimeColor = suspect.crime ? 'danger' : 'secondary';
                html += `
                    <div class="col-md-6 mb-4">
                        <div class="card suspect-card h-100">
                            <div class="card-body">
                                <div class="d-flex justify-content-between align-items-start mb-3">
                                    <h5 class="card-title mb-0">
                                        <span class="badge bg-dark">ID: ${actualIndex + 1}</span>
                                        ${suspect.name}
                                        ${suspect.evidenceImage ? '<span class="evidence-badge">📁 Evidence</span>' : ''}
                                    </h5>
                                    <button class="btn btn-sm btn-outline-danger" onclick="deleteSuspect(${actualIndex})">
                                        ❌
                                    </button>
                                </div>
                                
                                ${suspect.suspectImage ? `
                                    <div class="mb-3">
                                        <img src="${suspect.suspectImage}" class="suspect-image-display" 
                                             onclick="viewFullImage('${suspect.suspectImage}', 'Suspect Photo: ${suspect.name}')" 
                                             alt="Suspect Photo">
                                    </div>
                                ` : ''}
                                
                                <div class="mb-2">
                                    <strong>Age:</strong> ${suspect.age} years
                                </div>
                                
                                <div class="mb-2">
                                    <strong>Date of Birth:</strong> ${formatDate(suspect.dob)}
                                </div>
                                
                                ${suspect.gender ? `
                                    <div class="mb-2">
                                        <strong>Gender:</strong> ${suspect.gender}
                                    </div>
                                ` : ''}
                                
                                ${suspect.address ? `
                                    <div class="mb-2">
                                        <strong>Address:</strong> ${suspect.address}
                                    </div>
                                ` : ''}
                                
                                ${suspect.crime ? `
                                    <div class="mb-2">
                                        <strong>Crime Type:</strong> 
                                        <span class="badge bg-${crimeColor} badge-custom">${suspect.crime}</span>
                                    </div>
                                ` : ''}
                                
                                ${suspect.description ? `
                                    <div class="mt-3">
                                        <strong>Description:</strong>
                                        <p class="text-muted mb-0 mt-1">${suspect.description}</p>
                                    </div>
                                ` : ''}
                                
                                <div class="mt-3 text-muted small">
                                    <em>Added: ${new Date(suspect.timestamp).toLocaleString()}</em>
                                </div>
                            </div>
                        </div>
                    </div>
                `;
            });
            
            html += '</div>';
            if (suspects.length > 6) {
                html += `<p class="text-center text-white"><a href="view_suspects.html">View all ${suspects.length} suspects →</a></p>`;
            }
            suspectList.innerHTML = html;
        }

        // Function to delete a suspect
        function deleteSuspect(index) {
            if (confirm('Are you sure you want to delete this suspect record?')) {
                const deletedSuspect = suspects[index];
                addHistory('DELETE', deletedSuspect.name, `Deleted suspect: ${deletedSuspect.name}, Age: ${deletedSuspect.age}, Crime: ${deletedSuspect.crime || 'N/A'}`);
                suspects.splice(index, 1);
                saveSuspects();
                displaySuspects();
            }
        }


        // Image preview handlers
        document.getElementById('suspectImage').addEventListener('change', function(e) {
            handleImagePreview(e, 'imagePreview', 'suspectImageData');
        });

function handleImagePreview(event, previewId, dataKey) {
            const file = event.target.files[0];
            const preview = document.getElementById(previewId);
            
            if (file) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    window[dataKey] = e.target.result;
                    preview.innerHTML = `
                        <div class="image-preview-container">
                            <img src="${e.target.result}" class="image-preview" alt="Preview">
                            <div class="remove-image" onclick="removeImage('${previewId}', '${event.target.id}', '${dataKey}')">✕</div>
                        </div>
                    `;
                };
                reader.readAsDataURL(file);
            }
        }

        function removeImage(previewId, inputId, dataKey) {
            document.getElementById(previewId).innerHTML = '';
            document.getElementById(inputId).value = '';
            window[dataKey] = null;
        }

        function viewFullImage(imageSrc, title) {
            const modal = document.getElementById('imageModal');
            const modalImg = document.getElementById('modalImage');
            const modalTitle = document.getElementById('modalImageTitle');
            
            modal.style.display = 'block';
            modalImg.src = imageSrc;
            modalTitle.textContent = title;
        }

        function closeImageModal() {
            document.getElementById('imageModal').style.display = 'none';
        }

        // Close modal on outside click
        window.onclick = function(event) {
            const modal = document.getElementById('imageModal');
            if (event.target == modal) {
                modal.style.display = 'none';
            }
        }

        // Initialize image data
        window.suspectImageData = null;

        // Form submission handler
        document.getElementById('suspectForm').addEventListener('submit', function(e) {
            e.preventDefault();
            
            const suspect = {
                name: document.getElementById('suspectName').value,
                age: document.getElementById('suspectAge').value,
                dob: document.getElementById('suspectDOB').value,
                gender: document.getElementById('suspectGender').value,
                address: document.getElementById('suspectAddress').value,
                crime: document.getElementById('suspectCrime').value,
                description: document.getElementById('suspectDescription').value,
                suspectImage: window.suspectImageData || null,
                timestamp: new Date().toISOString()
            };
            
            suspects.push(suspect);
            saveSuspects();
            
            // Add to history
            addHistory('ADD', suspect.name, `Added new suspect: ${suspect.name}, Age: ${suspect.age}, Crime: ${suspect.crime || 'N/A'}`);
            
            displaySuspects();
            this.reset();
            document.getElementById('imagePreview').innerHTML = '';
            window.suspectImageData = null;
            alert('✅ Suspect information added successfully!');
            document.getElementById('suspectList').scrollIntoView({ behavior: 'smooth' });
        });

        // Clear all records
        document.getElementById('clearAll').addEventListener('click', function() {
            if (confirm('⚠️ Are you sure you want to delete ALL suspect records? This cannot be undone!')) {
                addHistory('CLEAR_ALL', 'System', `Cleared all ${suspects.length} suspect records from database`);
                suspects = [];
                saveSuspects();
                displaySuspects();
                alert('All records have been cleared.');
            }
        });
    </script>

    <!-- Image Modal -->
    <div id="imageModal" class="image-modal">
        <div class="image-modal-content">
            <span class="image-modal-close" onclick="closeImageModal()">&times;</span>
            <h3 id="modalImageTitle" style="color: #00ff00; text-align: center; margin-bottom: 20px;"></h3>
            <div style="text-align: center;">
                <img id="modalImage" src="" alt="Full view">
            </div>
        </div>
    </div>

</body>
</html>
